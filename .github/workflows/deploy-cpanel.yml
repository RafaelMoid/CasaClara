name: Deploy Casa Clara to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: casa-clara-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy static app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Casa Clara' }}
          VITE_APP_AUTHOR: ${{ vars.VITE_APP_AUTHOR || 'Rafael Varela' }}
          VITE_APP_DESCRIPTION: ${{ vars.VITE_APP_DESCRIPTION || 'Controle Financeiro para Casais' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_PRIVATE_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist to cPanel
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/cpanel_key -p ${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            dist/ "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_DEPLOY_PATH }}/"
